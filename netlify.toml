[build]
  command = "npm run build"
  publish = "outputs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/amsterdam-*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
