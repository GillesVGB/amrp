[build]
  command = "npm run build"
  publish = "outputs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Temporary closure runs before static files, redirects and normal page routes.
[[edge_functions]]
  function = "maintenance"
  path = "/*"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/community.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/amsterdam-*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
